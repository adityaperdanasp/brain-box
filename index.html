<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AI BrainBox</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#f6e3b4" />
<meta name="color-scheme" content="light only" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="styles/style.css?v=23" />
</head>
<body class="sc-page">

<!-- Page-level floating decoration (outside the app card) — ported from
     al-idrisi-games/index.html:62-89, same values, own file. -->
<div class="sc-blob" style="width:260px;height:260px;top:-120px;left:-80px;background:#F6E3B4;opacity:.7;"></div>
<div class="sc-blob" style="width:180px;height:180px;bottom:-90px;right:-60px;background:#F6C1C1;opacity:.6;"></div>
<div class="sc-blob" style="width:130px;height:130px;bottom:120px;left:-50px;background:#C1E1C1;opacity:.5;"></div>
<div class="sc-blob" style="width:110px;height:110px;top:30%;right:-40px;background:#D9C1F6;opacity:.5;"></div>
<div class="sc-blob" style="width:90px;height:90px;top:6%;right:26%;background:#C1D4F6;opacity:.4;"></div>
<div class="sc-cloud sc-bob" style="top:60px;left:8%;width:64px;height:64px;--r:-6deg;"></div>
<div class="sc-cloud" style="top:110px;left:calc(8% + 30px);width:34px;height:34px;"></div>
<div class="sc-cloud sc-bob" style="top:170px;right:6%;width:52px;height:52px;--r:4deg;animation-delay:.5s;"></div>
<div class="sc-cloud" style="top:200px;right:calc(6% + 34px);width:28px;height:28px;"></div>
<div class="sc-cloud sc-bob" style="bottom:14%;left:4%;width:58px;height:58px;--r:2deg;animation-delay:.3s;"></div>
<div class="sc-cloud" style="bottom:14%;left:calc(4% + 30px);width:30px;height:30px;"></div>
<div class="sc-star sc-bob" style="top:14%;right:14%;width:34px;height:34px;background:#F6C1E0;--r:8deg;"></div>
<div class="sc-star sc-bob" style="bottom:22%;left:10%;width:24px;height:24px;background:#D9C1F6;--r:-12deg;animation-delay:1s;"></div>
<div class="sc-star" style="top:38%;left:5%;width:20px;height:20px;background:#F6E3B4;opacity:.9;"></div>
<div class="sc-star sc-bob" style="top:8%;left:30%;width:20px;height:20px;background:#F6C1C1;--r:15deg;animation-delay:.8s;"></div>
<div class="sc-star sc-bob" style="top:46%;right:20%;width:26px;height:26px;background:#C1E1C1;--r:-8deg;animation-delay:.2s;"></div>
<div class="sc-star" style="bottom:34%;right:22%;width:16px;height:16px;background:#F6E3B4;opacity:.9;"></div>
<div class="sc-star" style="bottom:42%;left:16%;width:16px;height:16px;background:#C1D4F6;opacity:.9;"></div>
<div class="sc-balloon sc-bob" style="bottom:8%;right:8%;width:46px;height:46px;background:#F6E3B4;">
  <span style="position:absolute;width:70px;height:16px;border:3px solid #C1D4F6;border-radius:50%;top:15px;left:-12px;transform:rotate(-18deg);"></span>
</div>
<div class="sc-balloon sc-bob" style="top:24%;left:20%;width:34px;height:34px;background:#F6C1C1;animation-delay:.6s;">
  <span style="position:absolute;width:50px;height:12px;border:2px solid #F6E3B4;border-radius:50%;top:11px;left:-8px;transform:rotate(-18deg);"></span>
</div>
<div class="sc-dot" style="top:4%;left:50%;width:8px;height:8px;opacity:.8;"></div>
<div class="sc-dot" style="top:22%;right:38%;width:6px;height:6px;opacity:.7;"></div>
<div class="sc-dot" style="bottom:18%;left:40%;width:7px;height:7px;opacity:.7;"></div>
<div class="sc-dot" style="bottom:30%;right:10%;width:9px;height:9px;opacity:.8;"></div>

<div class="sc-card">

  <!-- Card-level decoration, sits behind every screen (z-index:0), so the
       app never feels bare even once you're past the landing screen.
       Kept fully inside the card bounds (no negative offsets) rather than
       relying on overflow:hidden clipping — that clip wasn't reliable
       inside the Android TWA's WebView, so a "half-poking-out" blob/star
       rendered as a stray shape sticking past the screen edge instead. -->
  <div class="sc-blob" style="top:10px;right:4px;width:56px;height:56px;background:#F6E3B4;opacity:.8;z-index:0;"></div>
  <div class="sc-star" style="top:60px;right:24px;width:16px;height:16px;background:#C1D4F6;z-index:0;"></div>
  <div class="sc-blob" style="bottom:20px;left:4px;width:70px;height:70px;background:#C1E1C1;opacity:.6;z-index:0;"></div>
  <div class="sc-star" style="top:14px;left:150px;width:14px;height:14px;background:#F6C1E0;transform:rotate(10deg);z-index:0;"></div>
  <div class="sc-dot" style="top:150px;left:8px;width:10px;height:10px;background:#F6C1C1;opacity:.9;z-index:0;"></div>
  <div class="sc-emoji" style="bottom:180px;left:10px;font-size:16px;transform:rotate(-10deg);z-index:0;">⭐</div>
  <div class="sc-emoji" style="top:34px;right:60px;font-size:13px;transform:rotate(8deg);z-index:0;">✨</div>

  <!-- Auth: a child signs up or in directly, same as al-idrisi-games' hub
       (no separate parent-account layer). -->
  <div class="sc-screen active" id="bb-screen-auth">
    <div class="sc-badge">🧠 AI BrainBox</div>
    <div class="sc-subtitle" style="text-align:center;">Mixed-topic practice for your kids</div>
    <div class="sc-auth-toggle">
      <button class="sc-auth-tab active" data-mode="signup">Sign Up</button>
      <button class="sc-auth-tab" data-mode="signin">Sign In</button>
    </div>
    <div class="sc-field">
      <span class="sc-field-label">Your name</span>
      <input type="text" class="sc-input" id="bb-auth-name" placeholder="e.g. Azka" autocomplete="off" />
    </div>
    <div class="sc-field">
      <span class="sc-field-label">4-digit PIN</span>
      <input type="password" inputmode="numeric" maxlength="4" class="sc-input" id="bb-auth-pin" placeholder="••••" autocomplete="off" />
    </div>
    <div class="sc-error" id="bb-auth-error"></div>
    <button class="sc-btn" id="bb-auth-submit">Register here 🚀</button>

    <!-- Decorative walking dino (astronaut-helmet T-Rex, same icon as
         al-idrisi-games/dinorace) — cosmetic only, landing screen only.
         Outer div walks + flips direction; inner img waddles — split in
         two so both animations can each own the `transform` property. -->
    <div class="bb-landing-dino-walk">
      <img src="icons/astro-dino.png" alt="" class="bb-landing-dino" />
    </div>
  </div>

  <!-- Main menu for the active child — matches al-idrisi-games' landing
       screen layout (header chip + hero + game-card list + greeting). -->
  <div class="sc-screen" id="bb-screen-menu">
    <div class="sc-header">
      <div class="sc-trophy">🧠</div>
      <div class="sc-player-chip">
        <span class="sc-player-avatar" id="bb-menu-avatar"></span>
        <span class="sc-player-name" id="bb-menu-name"></span>
      </div>
    </div>

    <div class="sc-hero">
      <div class="sc-hero-title">
        <img class="bb-hero-icon" src="icons/ai-avatar.png" alt="" />
        <span class="w3">AI</span> <span class="w1">Brain</span><span class="w2">Box</span>
      </div>
      <div class="sc-hero-tagline" id="bb-menu-box-count"></div>
    </div>

    <div class="sc-game-list">
      <button class="sc-game-card math" id="bb-menu-box-btn">
        <span class="sc-game-icon">📦</span>
        <span class="sc-game-txt">
          <span class="sc-game-title">Choose Subject To Learn</span>
          <span class="sc-game-sub">Pick up to 8 topics to mix</span>
        </span>
      </button>
      <button class="sc-game-card lang" id="bb-menu-practice-btn">
        <span class="sc-game-icon">✏️</span>
        <span class="sc-game-txt">
          <span class="sc-game-title">Practice</span>
          <span class="sc-game-sub">10 mixed questions</span>
        </span>
      </button>
      <button class="sc-game-card solar" id="bb-menu-drive-btn">
        <span class="sc-game-icon">🚗</span>
        <span class="sc-game-txt">
          <span class="sc-game-title">Drive Mode</span>
          <span class="sc-game-sub">Outrun the dino, answer to score</span>
        </span>
      </button>
    </div>

    <div class="sc-greeting" id="bb-menu-greeting"></div>
    <div style="text-align:center; margin-top:2.5rem;">
      <button id="bb-menu-logout" class="bb-logout-link">Log Out</button>
    </div>
  </div>

  <!-- Box builder -->
  <div class="sc-screen" id="bb-screen-box">
    <div class="sc-screen-title">Pilih Topik Latihan</div>
    <div class="sc-subtitle">Tandai topik yang bikin anak kesulitan — boleh campur dari pelajaran manapun (Math/Language/Science), sampai 8 topik. Soal latihan nanti diambil random dari topik-topik ini.</div>
    <div id="bb-box-container"></div>
    <button class="sc-btn" id="bb-box-done-btn" style="margin-top:1rem;">Done</button>
  </div>

  <!-- Practice session -->
  <div class="sc-screen" id="bb-screen-practice">
    <div id="bb-practice-container"></div>
  </div>

  <!-- Drive Mode -->
  <div class="sc-screen" id="bb-screen-drive">
    <div id="bb-drive-container"></div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="scripts/firebase.js?v=1"></script>
<script src="scripts/content-loader.js?v=5"></script>
<script src="scripts/mastery.js?v=2"></script>
<script src="scripts/roster.js?v=3"></script>
<script src="scripts/box.js?v=2"></script>
<script src="scripts/bgm.js?v=4"></script>
<script src="scripts/voice.js?v=1"></script>
<script src="scripts/practice.js?v=7"></script>
<script src="scripts/drive-mode.js?v=7"></script>
<script src="scripts/app.js?v=8"></script>
</body>
</html>
