<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Brain Box</title>
<link rel="stylesheet" href="styles/style.css?v=2" />
</head>
<body class="sc-page">

<div class="sc-card">

  <!-- Auth: parent sign up / sign in -->
  <div class="sc-screen active" id="bb-screen-auth">
    <div class="sc-badge">🧠 Brain Box</div>
    <div class="sc-subtitle" style="text-align:center;">Mixed-topic practice for your kids</div>
    <div class="sc-auth-toggle" style="display:flex; gap:0.5rem; margin: 1rem 0;">
      <button class="sc-chip sc-auth-tab active" data-mode="signup" style="flex:1; padding:0.6rem;">Sign Up</button>
      <button class="sc-chip sc-auth-tab" data-mode="signin" style="flex:1; padding:0.6rem;">Sign In</button>
    </div>
    <div class="sc-field">
      <span class="sc-field-label">Your name</span>
      <input type="text" class="sc-input" id="bb-auth-name" placeholder="e.g. Adit" autocomplete="off" />
    </div>
    <div class="sc-field">
      <span class="sc-field-label">4-digit PIN</span>
      <input type="password" inputmode="numeric" maxlength="4" class="sc-input" id="bb-auth-pin" placeholder="••••" autocomplete="off" />
    </div>
    <div class="sc-error" id="bb-auth-error"></div>
    <button class="sc-btn" id="bb-auth-submit">Let's Go! 🚀</button>
  </div>

  <!-- Children roster -->
  <div class="sc-screen" id="bb-screen-children">
    <div class="sc-screen-title" id="bb-children-title">Pick a child</div>
    <div style="display:flex; flex-direction:column; gap:0.6rem; margin: 1rem 0;" id="bb-children-list"></div>

    <div class="sc-field" id="bb-add-child-form" style="display:none;">
      <span class="sc-field-label">Child's name</span>
      <input type="text" class="sc-input" id="bb-add-child-name" placeholder="e.g. Azka" autocomplete="off" />
      <div class="sc-error" id="bb-add-child-error"></div>
      <div style="display:flex; gap:0.5rem; margin-top:0.4rem;">
        <button class="sc-btn" id="bb-add-child-confirm" style="flex:1;">Add</button>
        <button class="sc-btn sc-btn-secondary" id="bb-add-child-cancel" style="flex:1;">Cancel</button>
      </div>
    </div>

    <button class="sc-btn sc-btn-secondary" id="bb-add-child-btn">+ Add Child</button>
    <button class="sc-btn sc-btn-pink" id="bb-signout-btn" style="margin-top:0.5rem;">Sign Out</button>
  </div>

  <!-- Main menu for the active child -->
  <div class="sc-screen" id="bb-screen-menu">
    <div class="sc-screen-title" id="bb-menu-title">Brain Box</div>
    <div class="sc-subtitle" id="bb-menu-box-count"></div>
    <div style="display:flex; flex-direction:column; gap:0.7rem; margin-top:1rem;">
      <button class="sc-btn sc-btn-yellow" id="bb-menu-box-btn">📦 Build My Box</button>
      <button class="sc-btn" id="bb-menu-practice-btn">✏️ Practice</button>
      <button class="sc-btn sc-btn-secondary" id="bb-menu-drive-btn">🚗 Drive Mode</button>
      <button class="sc-chip" id="bb-menu-switch-btn" style="padding:0.6rem; text-align:center;">Switch Child</button>
    </div>
  </div>

  <!-- Box builder -->
  <div class="sc-screen" id="bb-screen-box">
    <div class="sc-screen-title">Build the Box</div>
    <div class="sc-subtitle">Tap or drag topics in — up to 8, any subject.</div>
    <div id="bb-box-container"></div>
    <button class="sc-btn" id="bb-box-done-btn" style="margin-top:1rem;">Done</button>
  </div>

  <!-- Practice session -->
  <div class="sc-screen" id="bb-screen-practice">
    <div id="bb-practice-container"></div>
  </div>

  <!-- Drive Mode -->
  <div class="sc-screen" id="bb-screen-drive">
    <div id="bb-drive-container"></div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="scripts/firebase.js?v=1"></script>
<script src="scripts/content-loader.js?v=1"></script>
<script src="scripts/mastery.js?v=1"></script>
<script src="scripts/roster.js?v=2"></script>
<script src="scripts/box.js?v=1"></script>
<script src="scripts/practice.js?v=1"></script>
<script src="scripts/drive-mode.js?v=1"></script>
<script src="scripts/app.js?v=2"></script>
</body>
</html>
